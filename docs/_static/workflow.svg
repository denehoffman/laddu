<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">The laddu analysis workflow</title>
  <desc id="desc">A channel defines both Monte Carlo generation and the symbolic model. Monte Carlo, the model, and observed data form a likelihood, fit, and physical projections.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#367979"/>
    </marker>
    <style>
      .box{fill:#f4f8f8;stroke:#367979;stroke-width:2}.warm{fill:#fff6eb;stroke:#a96f31;stroke-width:2}
      .label{font:600 18px system-ui,sans-serif;fill:#122626;text-anchor:middle}.sub{font:14px system-ui,sans-serif;fill:#315050;text-anchor:middle}
      .line{fill:none;stroke:#367979;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box" x="20" y="30" width="160" height="65" rx="12"/><text class="label" x="100" y="58">Channel</text><text class="sub" x="100" y="80">topology + proposals</text>
  <rect class="warm" x="20" y="135" width="160" height="65" rx="12"/><text class="label" x="100" y="163">Observed data</text><text class="sub" x="100" y="185">read + select</text>
  <rect class="warm" x="250" y="30" width="170" height="65" rx="12"/><text class="label" x="335" y="58">Monte Carlo</text><text class="sub" x="335" y="80">generate + accept</text>
  <rect class="box" x="250" y="135" width="170" height="65" rx="12"/><text class="label" x="335" y="163">Model</text><text class="sub" x="335" y="185">symbolic intensity</text>
  <rect class="box" x="500" y="82" width="160" height="65" rx="12"/><text class="label" x="580" y="110">Likelihood</text><text class="sub" x="580" y="132">compile + normalize</text>
  <rect class="warm" x="735" y="82" width="190" height="65" rx="12"/><text class="label" x="830" y="110">Fit &amp; project</text><text class="sub" x="830" y="132">physics results</text>
  <path class="line" d="M180 62 H250"/><path class="line" d="M180 62 C215 62 215 167 250 167"/>
  <path class="line" d="M180 167 C340 220 430 180 500 135"/>
  <path class="line" d="M420 62 C465 62 465 105 500 105"/><path class="line" d="M420 167 C465 167 465 125 500 125"/>
  <path class="line" d="M660 115 H735"/>
</svg>
