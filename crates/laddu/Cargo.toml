[package]
name = "laddu"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
laddu-amplitudes = { path = "../laddu-amplitudes", optional = true }
laddu-autodiff = { path = "../laddu-autodiff" }
laddu-compile = { path = "../laddu-compile" }
laddu-data = { path = "../laddu-data" }
laddu-expr = { path = "../laddu-expr" }
laddu-kernel = { path = "../laddu-kernel" }
laddu-likelihood = { path = "../laddu-likelihood", optional = true }
laddu-physics = { path = "../laddu-physics" }
laddu-runtime = { path = "../laddu-runtime" }
laddu-wgpu = { path = "../laddu-wgpu", optional = true }
thiserror.workspace = true

[features]
default = ["amplitudes", "likelihood"]
amplitudes = ["dep:laddu-amplitudes"]
likelihood = ["dep:laddu-likelihood"]
jit = ["laddu-runtime/jit", "laddu-likelihood?/jit"]
mpi = ["laddu-data/mpi", "laddu-runtime/mpi", "laddu-likelihood?/mpi"]
wgpu = ["dep:laddu-wgpu", "laddu-runtime/wgpu", "laddu-likelihood?/wgpu"]
svg = ["laddu-expr/svg"]

[dev-dependencies]
criterion.workspace = true
fastrand.workspace = true
num_cpus.workspace = true
rayon.workspace = true

[[bench]]
name = "kmatrix_benchmark"
harness = false
required-features = ["jit", "wgpu"]

[[bench]]
name = "jit_benchmark"
harness = false
required-features = ["jit"]
