[package]
name = "laddu-runtime"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs-header.html"]

[lints]
workspace = true

[dependencies]
cranelift = { workspace = true, optional = true }
laddu-autodiff.workspace = true
laddu-compile.workspace = true
laddu-data.workspace = true
laddu-expr.workspace = true
laddu-kernel.workspace = true
laddu-memory.workspace = true
laddu-wgpu = { workspace = true, optional = true }
mpi = { workspace = true, optional = true }
nalgebra.workspace = true
num.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
jit = ["dep:cranelift"]
mpi = ["dep:mpi", "laddu-data/mpi"]
wgpu = ["dep:laddu-wgpu", "laddu-memory/nvml"]
