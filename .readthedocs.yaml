version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
    rust: "1.96"
  jobs:
    post_install:
      # API documentation needs the extension and stubs, without release optimization or LTO.
      - >-
        CARGO_BUILD_JOBS=2 CARGO_PROFILE_DEV_DEBUG=0
        python -m pip install --verbose --force-reinstall
        --config-settings="maturin.build-args=--profile dev --generate-stubs --locked"
        ./python/laddu

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
