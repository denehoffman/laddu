version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
    rust: "1.96"
  jobs:
    post_install:
      - python -m pip install --force-reinstall --no-deps --config-settings="maturin.build-args=--generate-stubs" ./python/laddu

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
