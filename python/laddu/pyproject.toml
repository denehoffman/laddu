[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "laddu"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["numpy>=2"]

[project.optional-dependencies]
mpi = ["laddu-mpi==0.21.4"] # x-release-please-version

[dependency-groups]
dev = [
  "matplotlib>=3.10",
  "maturin>=1.13,<2",
  "ruff",
  "ty",
]

[tool.maturin]
module-name = "laddu"

[tool.uv]
config-settings = { "maturin.build-args" = "--generate-stubs" }

[tool.uv.sources]
laddu-mpi = { path = "../laddu-mpi" }
