default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types_or: [rust, toml]
        stages: [pre-commit]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust, toml]
        stages: [pre-push, manual]
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi
        language: system
        pass_filenames: false
        types_or: [rust, toml]
        stages: [pre-push, manual]
      - id: ty
        name: ty
        entry: just check-python-types
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-push, manual]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
  - repo: https://github.com/denehoffman/yamloom
    rev: yamloom-v0.6.1
    hooks:
      - id: yamloom-sync
        files: ^(\.github/workflows/.*\.ya?ml|\.yamloom\.py)$
        stages: [pre-commit]
