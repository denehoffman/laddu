# yamloom: generated from .yamloom.py
---
name: Build and publish laddu
"on":
  push:
    tags:
      - v*
  workflow_dispatch: ~
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Release preflight
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          cache-key: semver
      - name: Setup MPI
        if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
        uses: mpi4py/setup-mpi@v1
      - if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
        run: python3 scripts/ci.py release
        id: release
      - name: Install Rust Tool
        if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0
      - if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
        run: "python3 scripts/ci.py semver --baseline \"$RELEASE_BASELINE\""
        env:
          RELEASE_BASELINE: ${{ steps.release.outputs.baseline }}
  laddu-linux:
    name: Build Linux wheels
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            python_versions:
              - "3.11"
              - 3.14t
          - runner: ubuntu-22.04
            target: aarch64
            python_versions:
              - "3.11"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --locked --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-linux-${{ matrix.platform.target }}
  laddu-windows:
    name: Build Windows wheels
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_versions:
              - "3.11"
              - 3.14t
            python_arch: x64
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --locked --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-windows-${{ matrix.platform.target }}
  laddu-macos:
    name: Build macOS wheels
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            python_versions:
              - "3.11"
              - 3.14t
          - runner: macos-latest
            target: aarch64
            python_versions:
              - "3.11"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --locked --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-macos-${{ matrix.platform.target }}
  laddu-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu/Cargo.toml"
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-sdist
  laddu-local-linux:
    name: Build Linux wheels
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            python_versions:
              - "3.11"
              - 3.14t
          - runner: ubuntu-22.04
            target: aarch64
            python_versions:
              - "3.11"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --locked --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu-local/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-linux-${{ matrix.platform.target }}
  laddu-local-windows:
    name: Build Windows wheels
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_versions:
              - "3.11"
              - 3.14t
            python_arch: x64
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --locked --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu-local/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-windows-${{ matrix.platform.target }}
  laddu-local-macos:
    name: Build macOS wheels
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            python_versions:
              - "3.11"
              - 3.14t
          - runner: macos-latest
            target: aarch64
            python_versions:
              - "3.11"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --locked --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu-local/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-macos-${{ matrix.platform.target }}
  laddu-local-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu-local/Cargo.toml"
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-sdist
  laddu-mpi-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    needs:
      - preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu-mpi/Cargo.toml"
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-mpi-sdist
  release:
    name: Publish Python distributions
    permissions:
      id-token: write
    needs:
      - preflight
      - laddu-linux
      - laddu-windows
      - laddu-macos
      - laddu-sdist
      - laddu-local-linux
      - laddu-local-windows
      - laddu-local-macos
      - laddu-local-sdist
      - laddu-mpi-sdist
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-22.04
    environment: pypi
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
  publish-rust:
    name: Publish Rust crates
    permissions:
      contents: read
    needs:
      - preflight
      - laddu-linux
      - laddu-windows
      - laddu-macos
      - laddu-sdist
      - laddu-local-linux
      - laddu-local-windows
      - laddu-local-macos
      - laddu-local-sdist
      - laddu-mpi-sdist
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
      - name: Install Rust Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-workspaces
      - run: "cargo workspaces publish --from-git --token \"$CARGO_REGISTRY_TOKEN\" --yes"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
