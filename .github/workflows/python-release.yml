# yamloom: generated from .yamloom.py
---
name: Build and Release laddu (Python)
"on":
  push:
    branches:
      - development
      - main
    tags:
      - v*
  pull_request: ~
jobs:
  build-check-test:
    name: "Build, lint, and test"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: "clippy,rustfmt"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi -- -D warnings
      - run: cargo test --workspace --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi
      - run: cargo check -p laddu-python -p laddu-python-local -p laddu-python-mpi
      - run: uv sync --frozen --inexact --no-install-project --project python/laddu
      - run: uv run --no-sync --project python/laddu maturin develop --manifest-path python/laddu/Cargo.toml --release --generate-stubs
      - run: uv run --no-sync --project python/laddu ruff check . --exclude=.yamloom.py
      - run: uv run --no-sync --project python/laddu ty check python docs crates/laddu/examples
      - run: "uv run --no-sync --project python/laddu python -m unittest discover -s python/tests -p \"test_*.py\""
      - run: uv pip install --python python/laddu/.venv/bin/python -r docs/requirements.txt
      - run: uv run --no-sync --project python/laddu sphinx-build -E -W --keep-going -b html docs docs/_build/html
  free-threaded-test:
    name: Free-threaded Python
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14t
      - run: uv sync --frozen --inexact --no-install-project --project python/laddu
      - run: uv run --no-sync --project python/laddu maturin develop --manifest-path python/laddu/Cargo.toml --release --generate-stubs
      - run: "uv run --no-sync --project python/laddu python -m unittest discover -s python/tests -p \"test_*.py\""
  laddu-linux:
    name: Build Linux wheels
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
          - runner: ubuntu-22.04
            target: aarch64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-linux-${{ matrix.platform.target }}
  laddu-windows:
    name: Build Windows wheels
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
            python_arch: x64
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-windows-${{ matrix.platform.target }}
  laddu-macos:
    name: Build macOS wheels
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
          - runner: macos-latest
            target: aarch64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-macos-${{ matrix.platform.target }}
  laddu-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu/Cargo.toml"
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-sdist
  laddu-local-linux:
    name: Build Linux wheels
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
          - runner: ubuntu-22.04
            target: aarch64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --manifest-path python/laddu-local/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-linux-${{ matrix.platform.target }}
  laddu-local-windows:
    name: Build Windows wheels
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
            python_arch: x64
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --manifest-path python/laddu-local/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-windows-${{ matrix.platform.target }}
  laddu-local-macos:
    name: Build macOS wheels
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
          - runner: macos-latest
            target: aarch64
            python_versions:
              - "3.11"
              - "3.12"
              - "3.13"
              - "3.14"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --manifest-path python/laddu-local/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-macos-${{ matrix.platform.target }}
  laddu-local-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu-local/Cargo.toml"
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-local-sdist
  laddu-mpi-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    needs:
      - build-check-test
      - free-threaded-test
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu-mpi/Cargo.toml"
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          path: dist
          name: laddu-mpi-sdist
  release:
    name: Publish Python distributions
    permissions:
      id-token: write
    needs:
      - laddu-linux
      - laddu-windows
      - laddu-macos
      - laddu-sdist
      - laddu-local-linux
      - laddu-local-windows
      - laddu-local-macos
      - laddu-local-sdist
      - laddu-mpi-sdist
    runs-on: ubuntu-22.04
    environment: pypi
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
  publish-rust:
    name: Publish Rust crates
    permissions:
      contents: read
    needs:
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Rust Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-workspaces
      - run: cargo workspaces publish --from-git --token ${{ secrets.CARGO_REGISTRY_TOKEN }} --yes
