# yamloom: generated from .yamloom.py
---
name: Coverage
"on":
  pull_request:
    paths:
      - "**.rs"
      - Cargo.toml
      - crates/**/Cargo.toml
  push:
    branches:
      - development
      - main
    paths:
      - "**.rs"
      - Cargo.toml
      - crates/**/Cargo.toml
  workflow_dispatch: ~
jobs:
  coverage-rust:
    name: Rust coverage
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - name: Install Rust Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi --codecov --output-path coverage.json
      - name: Upload coverage
        if: ${{ (github.event_name != 'pull_request') }}
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage.json
          root_dir: ${{ github.workspace }}
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
