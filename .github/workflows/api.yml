# yamloom: generated from .yamloom.py
---
name: Rust API compatibility
"on": pull_request
jobs:
  api-compatibility:
    name: Public API and semver
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-21
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - name: Install Rust Tool
        uses: taiki-e/install-action@v2
        with:
          tool: "cargo-public-api@0.52.0,cargo-semver-checks@0.50.0"
      - name: Check public API snapshots
        run: scripts/public-api.sh --check
      - name: Check semantic version compatibility
        run: cargo semver-checks --workspace --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi --baseline-rev "origin/${{ github.base_ref }}" --all-features
