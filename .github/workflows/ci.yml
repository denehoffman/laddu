# yamloom: generated from .yamloom.py
---
name: CI
"on":
  - pull_request
  - workflow_dispatch
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request') }}
jobs:
  changes:
    name: Classify changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.changes.outputs.full }}
      release: ${{ steps.changes.outputs.release }}
      metrics: ${{ steps.changes.outputs.metrics }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/ci.py classify
        id: changes
  workflow-check:
    name: Workflow configuration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uvx --from yamloom==0.6.1 yamloom check
      - name: Install actionlint
        run: |-
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: actionlint
      - run: "python3 -m unittest discover -s scripts/tests -p \"test_ci*.py\""
  rust:
    name: Rust correctness
    permissions:
      contents: read
    needs:
      - changes
    if: "needs.changes.outputs.full == 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          components: "clippy,rustfmt"
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi -- -D warnings
      - run: cargo test --locked --workspace --exclude laddu-python --exclude laddu-python-local --exclude laddu-python-mpi
      - name: Validate workspace versions
        run: "cargo metadata --locked --no-deps --format-version 1 | jq -e '([.packages[].version] | unique | length == 1) and all(.packages[].dependencies[]; .path == null or .req != \"*\")'"
      - run: cargo check --locked -p laddu-python -p laddu-python-local -p laddu-python-mpi
  python:
    name: Python correctness and documentation
    permissions:
      contents: read
    needs:
      - changes
    if: "needs.changes.outputs.full == 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          cache-key: python-3.11
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - run: uv sync --frozen --inexact --no-install-project --project python/laddu
      - run: uv run --no-sync --directory python/laddu maturin develop --manifest-path Cargo.toml --locked --release --generate-stubs
      - run: uv run --no-sync --project python/laddu ruff check . --exclude=.yamloom.py
      - run: uv run --no-sync --project python/laddu ty check python docs crates/laddu/examples
      - run: uv run --no-sync --project python/laddu python -m pytest python/tests
      - run: uv pip install --python python/laddu/.venv/bin/python -r docs/requirements.txt
      - run: uv run --no-sync --project python/laddu sphinx-build -E -W --keep-going -b html docs docs/_build/html
  free-threaded:
    name: Free-threaded Python
    permissions:
      contents: read
    needs:
      - changes
    if: "needs.changes.outputs.full == 'true'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          cache-key: python-3.14t
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14t
      - run: uv sync --frozen --inexact --no-install-project --project python/laddu
      - run: uv run --no-sync --directory python/laddu maturin develop --manifest-path Cargo.toml --locked --release --generate-stubs
      - run: uv run --no-sync --project python/laddu python -m pytest python/tests
  release-check:
    name: Release versions and semver
    permissions:
      contents: read
    needs:
      - changes
    if: "needs.changes.outputs.release == 'true'"
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ steps.release.outputs.baseline }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          cache-key: semver
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - run: python3 scripts/ci.py release
        id: release
      - name: Install Rust Tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0
      - run: "python3 scripts/ci.py semver --baseline \"$RELEASE_BASELINE\""
        env:
          RELEASE_BASELINE: ${{ steps.release.outputs.baseline }}
  release-smoke:
    name: Release Linux packaging (${{ matrix.python }})
    permissions:
      contents: read
    needs:
      - changes
      - release-check
    if: "needs.changes.outputs.release == 'true'"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.11"
          - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          cache-key: smoke-${{ matrix.python }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Setup MPI
        uses: mpi4py/setup-mpi@v1
      - run: python3 scripts/ci_smoke.py
        env:
          SMOKE_PYTHON: ${{ matrix.python }}
  ci:
    name: CI
    permissions:
      contents: read
    needs:
      - changes
      - workflow-check
      - rust
      - python
      - free-threaded
      - release-check
      - release-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: python3 scripts/ci.py gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
