# yamloom: generated from .yamloom.py
---
name: Release Please
"on":
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE }}
        id: release
