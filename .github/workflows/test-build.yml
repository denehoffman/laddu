# yamloom: generated from .yamloom.py
---
name: Build laddu (Python)
"on": workflow_dispatch
jobs:
  laddu-linux:
    name: Build Linux wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            python_versions:
              - "3.11"
              - 3.14t
          - runner: ubuntu-22.04
            target: aarch64
            python_versions:
              - "3.11"
              - 3.14t
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          manylinux: "2014"
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
  laddu-windows:
    name: Build Windows wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_versions:
              - "3.11"
              - 3.14t
            python_arch: x64
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - run: printf "%s\n" ${{ join(matrix.platform.python_versions, ' ') }} > .yamloom-python-versions
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".yamloom-python-versions"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
  laddu-macos:
