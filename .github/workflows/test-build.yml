          sccache: ${{ !(startsWith(github.ref, 'refs/tags/')) }}
          args: --release --out dist --generate-stubs --features pyo3/abi3-py311,pyo3/abi3t-py315 --manifest-path python/laddu/Cargo.toml --interpreter ${{ join(matrix.platform.python_versions, ' ') }}
  laddu-sdist:
    name: Build Source Distribution
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: "--out dist --manifest-path python/laddu/Cargo.toml"
