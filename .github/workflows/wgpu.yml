# yamloom: generated from .yamloom.py
---
name: WGPU hardware validation
"on": workflow_dispatch
permissions:
  contents: read
jobs:
  hardware:
    name: WGPU hardware integration tests
    permissions:
      contents: read
    runs-on:
      - self-hosted
      - wgpu
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
      - run: cargo test --locked -p laddu-wgpu --test hardware -- --ignored
