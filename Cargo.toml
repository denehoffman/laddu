[workspace]
resolver = "2"
members = ["crates/*", "python/laddu", "python/laddu-local", "python/laddu-mpi"]
default-members = ["crates/*"]

[workspace.package]
authors = ["Nathaniel Dene Hoffman <nhoffman@wm.edu>"]
description = "Amplitude analysis tools for Rust"
edition = "2024"
homepage = "https://github.com/denehoffman/laddu"
license = "MIT OR Apache-2.0"
repository = "https://github.com/denehoffman/laddu"
rust-version = "1.95.0"
version = "0.21.5" # x-release-please-version

[workspace.dependencies]
accurate = "0.4.1"
approx = "0.5.1"
arrow = "59.2.0"
auto_ops = "0.3.0"
bitcode = { version = "0.6.9", features = ["serde"] }
bytemuck = "1.25.0"
criterion = { version = "5.0.1", package = "codspeed-criterion-compat", features = [
  "html_reports",
] }
cranelift = { version = "0.133.2", features = ["jit", "module", "native"] }
dyn-clone = "1.0.20"
errorfunctions = "0.2.0"
factorial = "0.4.0"
fastrand = "2.5.0"
fastrand-contrib = "0.1.0"
ganesh = "0.28.1"
indexmap = { version = "2.14.0", features = ["serde"] }
lazy_static = "1.5.0"
layout-rs = "0.1.3"
laddu = { version = "0.21.5", path = "crates/laddu" } # x-release-please-version
laddu-amplitudes = { version = "0.21.5", path = "crates/laddu-amplitudes" } # x-release-please-version
laddu-autodiff = { version = "0.21.5", path = "crates/laddu-autodiff" } # x-release-please-version
laddu-compile = { version = "0.21.5", path = "crates/laddu-compile" } # x-release-please-version
laddu-core = { package = "laddu", version = "0.21.5", path = "crates/laddu" } # x-release-please-version
laddu-data = { version = "0.21.5", path = "crates/laddu-data" } # x-release-please-version
laddu-expr = { version = "0.21.5", path = "crates/laddu-expr" } # x-release-please-version
laddu-fit = { version = "0.21.5", path = "crates/laddu-fit" } # x-release-please-version
laddu-generation = { version = "0.21.5", path = "crates/laddu-generation" } # x-release-please-version
laddu-kernel = { version = "0.21.5", path = "crates/laddu-kernel" } # x-release-please-version
laddu-likelihood = { version = "0.21.5", path = "crates/laddu-likelihood" } # x-release-please-version
laddu-memory = { version = "0.21.5", path = "crates/laddu-memory" } # x-release-please-version
laddu-physics = { version = "0.21.5", path = "crates/laddu-physics" } # x-release-please-version
laddu-runtime = { version = "0.21.5", path = "crates/laddu-runtime" } # x-release-please-version
laddu-wgpu = { version = "0.21.5", path = "crates/laddu-wgpu" } # x-release-please-version
maryada = { version = "0.2.1", features = ["branch"] }
mpi = { version = "0.8.2", features = ["complex"] }
mpi_test = "0.1.1"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
nvml-wrapper = "0.12.1"
num = { version = "0.4.3", features = ["serde"] }
num_cpus = { version = "1.17.0" }
numpy = { version = "0.29.0", features = ["nalgebra"] }
num-traits = "0.2.19"
parquet = "59.2.0"
parking_lot = { version = "0.12.5", features = ["serde"] }
pyo3 = { version = "0.29.2" }
pollster = "1.0.1"
rapidhash = { version = "4.5.1" }
rayon = { version = "1.12.0" }
oxyroot = "0.1.25"
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
serde-pickle = "1.2.0"
serde_with = "3.22.0"
shellexpand = "3.1.2"
smallvec = "1.15.2"
sysinfo = "0.39.6"
thiserror = "2.0.20"
typetag = "0.2.23"
wgpu = "30.0.0"
naga = { version = "30.0.0", features = ["wgsl-in"] }
windows = "0.62.2"

[workspace.dependencies.objc2-metal]
version = "0.3.2"
default-features = false
features = ["MTLDevice"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"


[profile.release]
lto = "fat"
debug = false
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.debug-release]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
opt-level = 3
debug = true
strip = "none"
lto = true
codegen-units = 1
incremental = false
panic = "abort"
