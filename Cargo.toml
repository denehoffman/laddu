[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
authors = ["Nathaniel Dene Hoffman <nhoffman@wm.edu>"]
edition = "2024"
homepage = "https://github.com/denehoffman/laddu"
license = "MIT OR Apache-2.0"
repository = "https://github.com/denehoffman/laddu"
rust-version = "1.94.0"

[workspace.dependencies]
accurate = "0.4.1"
approx = "0.5.1"
arrow = "59.1.0"
auto_ops = "0.3.0"
bitcode = { version = "0.6.9", features = ["serde"] }
bytemuck = "1.25.0"
criterion = { version = "5.0.1", package = "codspeed-criterion-compat", features = [
  "html_reports",
] }
cranelift = { version = "0.133.1", features = ["jit", "module", "native"] }
dyn-clone = "1.0.20"
errorfunctions = "0.2.0"
factorial = "0.4.0"
fastrand = "2.4.0"
fastrand-contrib = "0.1.0"
ganesh = "0.28.1"
indexmap = { version = "2.14.0", features = ["serde"] }
lazy_static = "1.5.0"
layout-rs = "0.1.3"
mpi = { version = "0.8.2", features = ["complex"] }
mpi_test = "0.1.1"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
num = { version = "0.4.3", features = ["serde"] }
num_cpus = { version = "1.17.0" }
numpy = { version = "0.29.0", features = ["nalgebra"] }
num-traits = "0.2.19"
parquet = "59.1.0"
parking_lot = { version = "0.12.5", features = ["serde"] }
pyo3 = { version = "0.29.0" }
pollster = "1.0.1"
rapidhash = { version = "4.5.1" }
rayon = { version = "1.12.0" }
oxyroot = "0.1.25"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
serde-pickle = "1.2.0"
serde_with = "3.21.0"
shellexpand = "3.1.2"
smallvec = "1.15.2"
sysinfo = "0.39.6"
thiserror = "2.0.18"
typetag = "0.2.22"
wgpu = "30.0.0"


[profile.release]
lto = "fat"
debug = false
codegen-units = 1

[profile.bench]
inherits = "release"

[profile.debug-release]
inherits = "release"
debug = true

[profile.profiling]
inherits = "release"
opt-level = 3
debug = true
strip = "none"
lto = true
codegen-units = 1
incremental = false
panic = "abort"
